name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_NAME: Ithqan

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ''
        with:
          args: --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

  create-release:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Rename artifacts for clarity
        run: |
          mkdir -p release-assets

          # Find and rename DMGs
          for dmg in $(find artifacts/macos-aarch64-apple-darwin -name "*.dmg" 2>/dev/null); do
            cp "$dmg" "release-assets/Ithqan_${{ github.ref_name }}_aarch64.dmg"
          done

          for dmg in $(find artifacts/macos-x86_64-apple-darwin -name "*.dmg" 2>/dev/null); do
            cp "$dmg" "release-assets/Ithqan_${{ github.ref_name }}_x64.dmg"
          done

          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ithqan ${{ github.ref_name }}
          body: |
            ## Ithqan ${{ github.ref_name }}

            ### Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS | Apple Silicon (M1/M2/M3/M4) | `Ithqan_${{ github.ref_name }}_aarch64.dmg` |
            | macOS | Intel (x86_64) | `Ithqan_${{ github.ref_name }}_x64.dmg` |

            ### Install via Homebrew
            ```bash
            brew tap AIEraDev/tap
            brew install --cask ithqan
            ```

            ### Manual Install
            1. Download the `.dmg` for your Mac's architecture
            2. Open the `.dmg` and drag **Ithqan** to Applications
            3. On first launch, right-click → Open to bypass Gatekeeper (unsigned build)
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Homebrew tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: AIEraDev/homebrew-tap
          event-type: update-cask
          client-payload: '{"version": "${{ github.ref_name }}"}'
